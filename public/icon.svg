<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="rupyaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#093829" />
      <stop offset="50%" stop-color="#044e3b" />
      <stop offset="100%" stop-color="#02281e" />
    </linearGradient>
    <linearGradient id="leafGradLeft" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>
    <linearGradient id="leafGradRight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>
    <linearGradient id="seedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="52%" r="48%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#059669" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#02281e" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle Base for Android & Apple App Icon -->
  <rect width="512" height="512" rx="128" fill="url(#rupyaBg)" />

  <!-- Ambient Botanical Glow -->
  <circle cx="256" cy="265" r="190" fill="url(#ambientGlow)" />

  <!-- Rupya Seed & Sprout Composition -->
  <g filter="url(#shadow)">
    <!-- Upright Sprout Stem -->
    <path d="M 256 385 C 256 315 252 245 256 160" stroke="#a7f3d0" stroke-width="26" stroke-linecap="round" fill="none" />

    <!-- Left Sprout Leaf (Organic curve) -->
    <path d="M 252 255 C 195 255 135 205 125 135 C 195 130 248 185 252 255 Z" fill="url(#leafGradLeft)" />

    <!-- Right Sprout Leaf (Reaching higher - Financial Prosperity) -->
    <path d="M 260 215 C 300 160 375 115 405 125 C 405 195 340 235 260 215 Z" fill="url(#leafGradRight)" />

    <!-- Golden Seed Base (Foundation of Savings & Investment) -->
    <path d="M 210 395 C 210 360 256 315 256 315 C 256 315 302 360 302 395 C 302 425 281 445 256 445 C 231 445 210 425 210 395 Z" fill="url(#seedGrad)" />

    <!-- Golden Spark of Wealth -->
    <circle cx="415" cy="110" r="16" fill="#fef08a" opacity="0.95" />
    <circle cx="415" cy="110" r="24" fill="#fef08a" opacity="0.3" />
  </g>
</svg>
