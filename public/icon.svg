<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Soft shadow for the squircle -->
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
    <!-- Gradient for golden coin seed -->
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dba954" />
      <stop offset="50%" stop-color="#c99a4c" />
      <stop offset="100%" stop-color="#b8873d" />
    </linearGradient>
    <linearGradient id="coinInner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8bf6a" />
      <stop offset="100%" stop-color="#be8c3e" />
    </linearGradient>
  </defs>

  <!-- Clean Scandinavian White Squircle Background -->
  <rect width="512" height="512" rx="128" fill="#ffffff" />

  <!-- Sage Green Stem & Sprout -->
  <g transform="translate(0, 0)">
    <!-- Left Leaf (Soft Sage) -->
    <path d="M 245 350 C 180 340 115 290 112 225 C 175 228 235 285 245 350 Z" fill="#75967f" />
    <path d="M 112 225 C 150 250 210 310 245 350 C 220 300 170 240 112 225 Z" fill="#5e8068" />

    <!-- Center Vertical Leaf -->
    <path d="M 256 270 C 225 220 205 155 256 95 C 256 160 256 220 256 270 Z" fill="#8eb098" />
    <path d="M 256 270 C 256 220 256 160 256 95 C 307 155 287 220 256 270 Z" fill="#6b8e76" />

    <!-- Golden Coin / Seed Pod (Right) -->
    <g transform="translate(335, 315)">
      <!-- Outer coin shape with bevel -->
      <circle cx="0" cy="0" r="80" fill="url(#coinGrad)" />
      <circle cx="0" cy="0" r="56" fill="url(#coinInner)" />
      <circle cx="0" cy="0" r="56" stroke="#eecf87" stroke-width="4" fill="none" opacity="0.6" />
    </g>

    <!-- Main Curved Stem (Emerging from bottom and wrapping around the coin) -->
    <path d="M 243 405 L 270 405 C 270 375 262 340 290 285 C 320 235 365 230 375 235 C 382 240 375 260 355 275 C 320 300 290 345 290 405 Z" fill="#75967f" />
    <path d="M 243 405 C 243 355 245 310 256 270 C 256 315 255 360 265 405 Z" fill="#5e8068" />
  </g>
</svg>
