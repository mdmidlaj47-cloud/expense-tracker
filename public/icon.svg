<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>
  <!-- Background with rounded squircles for Android -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Subtle inner card glow -->
  <circle cx="256" cy="256" r="180" fill="#10b981" opacity="0.15" />
  
  <!-- Rupee Symbol -->
  <g filter="url(#shadow)" fill="none" stroke="#ffffff" stroke-width="36" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top bar -->
    <path d="M 176 150 L 336 150" />
    <!-- Second bar -->
    <path d="M 176 210 L 320 210" />
    <!-- Upper loop and stem -->
    <path d="M 230 150 L 230 270 C 310 270 310 150 230 150" />
    <!-- Diagonal leg -->
    <path d="M 220 270 L 336 380" />
  </g>
  <!-- Growth spark dot -->
  <circle cx="360" cy="140" r="18" fill="url(#goldGrad)" filter="url(#shadow)" />
</svg>
