<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // 1. Ensure trailing slash on GitHub Pages so relative assets and PWA scopes always resolve accurately
      if (window.location.pathname === '/expense-tracker') {
        window.location.replace('/expense-tracker/' + window.location.search + window.location.hash);
      }
      // 2. Instant Theme Bootstrapper (Prevents white flash on refresh when dark theme is enabled)
      (function() {
        try {
          var raw = localStorage.getItem('rupya_settings_v1') || localStorage.getItem('rupeetrack_settings_v1');
          var settings = raw ? JSON.parse(raw) : null;
          var theme = (settings && settings.theme) ? settings.theme : 'light';
          var themeBgs = {
            midnight: '#060b17',
            sunset: '#0c0807',
            amoled: '#000000',
            emerald: '#020617',
            light: '#f8fafc'
          };
          var bg = themeBgs[theme] || (theme === 'light' ? '#f8fafc' : '#020617');
          var text = theme === 'light' ? '#0f172a' : '#f8fafc';
          document.documentElement.style.backgroundColor = bg;
          document.documentElement.style.color = text;
        } catch(e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./pwa-192x192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-180x180.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="./pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="./pwa-512x512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" id="theme-color-meta" content="#f8fafc" />
    <script>
      // Immediately sync theme-color meta tag before first paint
      (function() {
        try {
          var raw = localStorage.getItem('rupya_settings_v1') || localStorage.getItem('rupeetrack_settings_v1');
          var settings = raw ? JSON.parse(raw) : null;
          var theme = (settings && settings.theme) ? settings.theme : 'light';
          var themeBgs = {
            midnight: '#060b17',
            sunset: '#0c0807',
            amoled: '#000000',
            emerald: '#020617',
            light: '#f8fafc'
          };
          var bg = themeBgs[theme] || (theme === 'light' ? '#f8fafc' : '#020617');
          var meta = document.getElementById('theme-color-meta');
          if (meta) meta.setAttribute('content', bg);
        } catch(e) {}
      })();
    </script>
    <meta name="description" content="Fast, private personal expense & budget tracker for iPhone and Android" />
    
    <!-- PWA & iOS Safari meta tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Rupya" />
    <link rel="manifest" href="./manifest.json" />

    <!-- Google Font: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <title>Rupya - Expense & Budget Tracker</title>
  </head>
  <body class="antialiased selection:bg-emerald-200 selection:text-emerald-900 select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').catch(err => {
            console.log('SW registration note:', err);
          });
        });
      }
    </script>
  </body>
</html>
